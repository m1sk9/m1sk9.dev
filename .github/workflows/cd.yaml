name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Development Environment
        uses: jdx/mise-action@v4

      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Build with Zola
        run: zola build

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./build
          # Keep dot-directories like .well-known/ (security.txt) in the artifact
          include-hidden-files: true
  deploy:
    runs-on: ubuntu-24.04
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deploy-to-pages.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deploy-to-pages
        uses: actions/deploy-pages@v5

  # Kept alongside the Pages deploy until the DNS cutover in m1sk9/infra#325 is
  # verified, so that pointing m1sk9.dev back at m1sk9.github.io is enough to roll back.
  deploy-workers:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Setup Development Environment
        uses: jdx/mise-action@v4

      - name: Build with Zola
        run: zola build

      - name: Deploy to Cloudflare Workers
        run: wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          WRANGLER_SEND_METRICS: "false"
